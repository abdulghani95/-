<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2b705">
<meta name="color-scheme" content="light dark">
<title>حاسبة البلوك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Layout: one narrow column, a segmented switch for the two ways to calculate, an input card, then a results sheet like a site delivery slip. */
:root {
  --bg: #e6e7e3;
  --surface: #f5f5f2;
  --ink: #22262b;
  --muted: #5d636b;
  --line: #cfd1cc;
  --accent: #f2b705;
  --accent-ink: #22262b;
  --field: #ffffff;
  --font-display: "Noto Kufi Arabic", "Segoe UI", Tahoma, "Geeza Pro", "Droid Arabic Kufi", system-ui, sans-serif;
  --font-body: "Segoe UI", Tahoma, "Geeza Pro", "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191c; --surface: #212428; --ink: #ecece8; --muted: #9aa0a8;
    --line: #34383d; --accent: #f2b705; --accent-ink: #17191c; --field: #17191c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17191c; --surface: #212428; --ink: #ecece8; --muted: #9aa0a8;
  --line: #34383d; --accent: #f2b705; --accent-ink: #17191c; --field: #17191c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  direction: rtl;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.3; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--line); padding: 4px; border-radius: 10px; }
.seg button {
  font: inherit; font-weight: 700; font-size: 15px; color: var(--muted);
  background: transparent; border: 0; border-radius: 7px; padding: 10px 8px; cursor: pointer; min-width: 0;
}
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.seg.small button { font-size: 13px; padding: 7px 6px; font-weight: 500; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.field { display: flex; align-items: stretch; border: 1.5px solid var(--line); background: var(--field); border-radius: 8px; overflow: hidden; }
.field:focus-within { border-color: var(--accent); }
.field input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 26px; padding: 8px 12px;
  direction: ltr; text-align: right; font-variant-numeric: tabular-nums;
}
.field input:focus-visible { outline: none; }
.field .unit { display: grid; place-items: center; padding: 0 14px; background: var(--line); color: var(--muted); font-weight: 700; font-size: 14px; white-space: nowrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two > * { min-width: 0; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

.slip { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.slip-head {
  padding: 12px 16px; font-family: var(--font-display); font-weight: 700; font-size: 15px;
  background-color: var(--accent); color: var(--accent-ink);
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
.slip-head span:last-child { font-family: var(--font-body); font-weight: 500; font-size: 13px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .name { font-weight: 700; }
.row .note { grid-column: 1; color: var(--muted); font-size: 13px; }
.row .num { grid-column: 2; grid-row: 1 / span 2; text-align: left; direction: ltr; font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.row .num small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); margin-inline-start: 6px; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
summary { cursor: pointer; padding: 12px 16px; font-weight: 700; font-size: 14px; }
.settings { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.settings .field input { font-size: 20px; }
.foot { color: var(--muted); font-size: 12.5px; margin: 0; }
.install { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; }
.install span { min-width: 0; }
.install button { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>حاسبة البلوك</h1>
    <p class="sub">بلوك 20 × 40 سم. كل 100 بلوكة تحتاج كيس إسمنت و3 عربيات نحاتة.</p>
  </header>

  <div class="install" id="install" hidden>
    <span id="installMsg"></span>
    <button id="installBtn" type="button" hidden>تثبيت التطبيق</button>
  </div>

  <div class="seg" role="tablist" aria-label="طريقة الحساب">
    <button role="tab" id="tab-area" aria-selected="true" aria-controls="panel">من المساحة</button>
    <button role="tab" id="tab-blocks" aria-selected="false" aria-controls="panel">من عدد البلوك</button>
  </div>

  <section class="card" id="panel" aria-live="polite">
    <div id="areaMode">
      <div class="seg small" role="group" aria-label="إدخال المساحة" style="margin-bottom:12px">
        <button type="button" id="by-area" aria-selected="true">أعرف المساحة</button>
        <button type="button" id="by-dim" aria-selected="false">طول × ارتفاع</button>
      </div>
      <div id="areaBox">
        <label for="area">مساحة الجدار</label>
        <div class="field"><input id="area" type="text" inputmode="decimal" value="50" autocomplete="off"><span class="unit">م²</span></div>
      </div>
      <div id="dimBox" hidden>
        <div class="two">
          <div>
            <label for="len">الطول</label>
            <div class="field"><input id="len" type="text" inputmode="decimal" value="10" autocomplete="off"><span class="unit">م</span></div>
          </div>
          <div>
            <label for="hei">الارتفاع</label>
            <div class="field"><input id="hei" type="text" inputmode="decimal" value="3" autocomplete="off"><span class="unit">م</span></div>
          </div>
        </div>
        <p class="hint" id="dimOut" style="margin-top:8px"></p>
      </div>
      <div style="margin-top:14px">
        <label for="waste">نسبة الهدر والكسر (اختياري)</label>
        <div class="field"><input id="waste" type="text" inputmode="decimal" value="0" autocomplete="off"><span class="unit">%</span></div>
      </div>
    </div>

    <div id="blocksMode" hidden>
      <label for="blocks">عدد البلوك</label>
      <div class="field"><input id="blocks" type="text" inputmode="numeric" value="625" autocomplete="off"><span class="unit">بلوكة</span></div>
    </div>
  </section>

  <section class="slip" aria-label="النتيجة">
    <div class="slip-head"><span>المواد المطلوبة</span><span id="basis"></span></div>
    <div class="row" id="rowBlocks">
      <span class="name">البلوك</span>
      <span class="note" id="noteBlocks"></span>
      <span class="num"><span id="outBlocks">0</span><small>بلوكة</small></span>
    </div>
    <div class="row">
      <span class="name">إسمنت</span>
      <span class="note" id="noteCement"></span>
      <span class="num"><span id="outCement">0</span><small>كيس</small></span>
    </div>
    <div class="row">
      <span class="name">نحاتة</span>
      <span class="note" id="noteSand"></span>
      <span class="num"><span id="outSand">0</span><small>عربية</small></span>
    </div>
  </section>

  <details>
    <summary>تعديل المقاسات والنسب</summary>
    <div class="settings">
      <div class="two">
        <div>
          <label for="bh">ارتفاع البلوكة</label>
          <div class="field"><input id="bh" type="text" inputmode="decimal" value="20" autocomplete="off"><span class="unit">سم</span></div>
        </div>
        <div>
          <label for="bl">طول البلوكة</label>
          <div class="field"><input id="bl" type="text" inputmode="decimal" value="40" autocomplete="off"><span class="unit">سم</span></div>
        </div>
      </div>
      <div class="two">
        <div>
          <label for="cem">أكياس لكل 100</label>
          <div class="field"><input id="cem" type="text" inputmode="decimal" value="1" autocomplete="off"><span class="unit">كيس</span></div>
        </div>
        <div>
          <label for="snd">عربيات لكل 100</label>
          <div class="field"><input id="snd" type="text" inputmode="decimal" value="3" autocomplete="off"><span class="unit">عربية</span></div>
        </div>
      </div>
      <p class="hint" id="perM2"></p>
    </div>
  </details>

  <p class="foot">الأرقام تُقرَّب للأعلى لأن الكيس والعربية لا يُشترون بالكسور. الرقم الدقيق يظهر تحت كل مادة.</p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var mode = 'area';   // 'area' | 'blocks'
  var dimMode = false; // false: area known, true: length x height
  var KEY = 'block-calc-v1';
  var IDS = ['area', 'len', 'hei', 'waste', 'blocks', 'bh', 'bl', 'cem', 'snd'];

  function num(v) {
    var s = String(v).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; })
                     .replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 0x06F0; })
                     .replace(/[٫٬,،]/g, '.');
    var n = parseFloat(s);
    return isFinite(n) && n > 0 ? n : 0;
  }
  function fmt(n) {
    return (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
  }
  function up(n) { return Math.ceil(n - 1e-9); }

  function save() {
    try {
      var data = { mode: mode, dimMode: dimMode };
      IDS.forEach(function (id) { data[id] = $(id).value; });
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!data) return;
      IDS.forEach(function (id) { if (typeof data[id] === 'string') $(id).value = data[id]; });
      if (data.mode === 'blocks') mode = 'blocks';
      if (data.dimMode === true) dimMode = true;
    } catch (e) {}
  }

  function calc() {
    var bh = num($('bh').value), bl = num($('bl').value);
    var cem = num($('cem').value), snd = num($('snd').value);
    var perM2 = (bh > 0 && bl > 0) ? 10000 / (bh * bl) : 0;
    $('perM2').textContent = perM2 ? 'كل متر مربع يحتاج ' + fmt(perM2) + ' بلوكة.' : 'أدخل مقاس البلوكة.';

    var blocks = 0, area = 0, waste = 0;
    if (mode === 'area') {
      if (dimMode) {
        area = num($('len').value) * num($('hei').value);
        $('dimOut').textContent = 'المساحة: ' + fmt(area) + ' م²';
      } else {
        area = num($('area').value);
      }
      waste = num($('waste').value);
      var raw = area * perM2 * (1 + waste / 100);
      blocks = up(raw);
      $('basis').textContent = fmt(area) + ' م²';
      $('noteBlocks').textContent = (waste ? 'مع هدر ' + fmt(waste) + '%' : fmt(area) + ' م² × ' + fmt(perM2)) + (raw && raw !== blocks ? ' = ' + fmt(raw) : '');
    } else {
      blocks = up(num($('blocks').value));
      $('basis').textContent = fmt(blocks) + ' بلوكة';
      $('noteBlocks').textContent = 'العدد الذي أدخلته';
    }

    var bagsExact = blocks / 100 * cem;
    var sandExact = blocks / 100 * snd;
    $('outBlocks').textContent = fmt(blocks);
    $('outCement').textContent = fmt(up(bagsExact));
    $('outSand').textContent = fmt(up(sandExact));
    $('noteCement').textContent = 'بالحساب ' + fmt(bagsExact) + ' كيس';
    $('noteSand').textContent = 'بالحساب ' + fmt(sandExact) + ' عربية';
    $('rowBlocks').hidden = mode === 'blocks';
    save();
  }

  function setMode(m) {
    mode = m;
    $('tab-area').setAttribute('aria-selected', m === 'area');
    $('tab-blocks').setAttribute('aria-selected', m === 'blocks');
    $('areaMode').hidden = m !== 'area';
    $('blocksMode').hidden = m !== 'blocks';
    calc();
  }
  function setDim(d) {
    dimMode = d;
    $('by-area').setAttribute('aria-selected', !d);
    $('by-dim').setAttribute('aria-selected', d);
    $('areaBox').hidden = d;
    $('dimBox').hidden = !d;
    calc();
  }

  $('tab-area').addEventListener('click', function () { setMode('area'); });
  $('tab-blocks').addEventListener('click', function () { setMode('blocks'); });
  $('by-area').addEventListener('click', function () { setDim(false); });
  $('by-dim').addEventListener('click', function () { setDim(true); });
  IDS.forEach(function (id) {
    $(id).addEventListener('input', calc);
    $(id).addEventListener('focus', function (e) { e.target.select(); });
  });

  // Install helper
  var deferred = null;
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  function showInstall(msg, canInstall) {
    if (standalone) return;
    $('install').hidden = false;
    $('installMsg').textContent = msg;
    $('installBtn').hidden = !canInstall;
  }
  if (location.protocol === 'file:') {
    showInstall('أنت تفتح الملف من الجهاز. للتثبيت افتح رابط GitHub Pages الذي يبدأ بـ https.', false);
  } else {
    showInstall('للتثبيت: من قائمة Chrome ⋮ اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".', false);
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    showInstall('ثبّت التطبيق ليعمل بدون إنترنت.', true);
  });
  $('installBtn').addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; $('install').hidden = true; });
  });
  window.addEventListener('appinstalled', function () { $('install').hidden = true; });

  load();
  setDim(dimMode);
  setMode(mode);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
